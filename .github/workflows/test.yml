name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.11'
      - name: Verify package manifest and boundaries
        run: python tools/verify_package.py
      - name: Compile Python sources
        run: python -m compileall -q skills/codex-desktop-control/scripts
      - name: Run protocol regression tests
        run: python skills/codex-desktop-control/scripts/test_protocol_v2.py
      - name: Run owner recovery regression tests
        run: python skills/codex-desktop-control/scripts/test_owner_recovery.py
      - name: Run certification settings regression tests
        run: python skills/codex-desktop-control/scripts/test_certification_settings.py
      - name: Build and inspect deterministic release ZIP
        run: python tools/test_release.py
      - name: Parse bootstrap script
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'skills/codex-desktop-control/scripts/bootstrap.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
